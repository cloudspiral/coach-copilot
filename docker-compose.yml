services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coach_copilot
      POSTGRES_USER: coach_copilot
      POSTGRES_PASSWORD: coach_copilot
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - coach_copilot_postgres:/var/lib/postgresql/data
      - ./scripts/init-test-database.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach_copilot -d coach_copilot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  coach_copilot_postgres:
